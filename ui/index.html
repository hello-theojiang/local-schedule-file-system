<!doctype html>
<html lang="fr" data-theme="light" data-accent="violet">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f7f6f3">
  <title>Agenda</title>
  <link rel="icon" href="icon.png">
  <link rel="preload" href="fonts/inter.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="app.css">
  <script src="js/theme.js"></script>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></symbol>
      <symbol id="i-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-month" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16" rx="3"/><path d="M3 9.5h18M8 3v3M16 3v3M7.5 13.5h.01M12 13.5h.01M16.5 13.5h.01M7.5 17h.01M12 17h.01"/></symbol>
      <symbol id="i-week" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="4.5" width="18" height="16" rx="3"/><path d="M9 4.5v16M15 4.5v16"/></symbol>
      <symbol id="i-today" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></symbol>
      <symbol id="i-tasks" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="17" height="17" rx="4"/><path d="m8 12.2 2.7 2.7L16.2 9"/></symbol>
      <symbol id="i-gear" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></symbol>
      <symbol id="i-menu" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></symbol>
      <symbol id="i-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4.5h6V7M6.5 7l.8 12.5a1.5 1.5 0 0 0 1.5 1.5h6.4a1.5 1.5 0 0 0 1.5-1.5L17.5 7"/></symbol>
      <symbol id="i-clock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></symbol>
      <symbol id="i-pin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.3"/></symbol>
      <symbol id="i-repeat" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m17 2 3 3-3 3"/><path d="M4 11V9a4 4 0 0 1 4-4h12M7 22l-3-3 3-3"/><path d="M20 13v2a4 4 0 0 1-4 4H4"/></symbol>
      <symbol id="i-bell" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16V11a6 6 0 1 1 12 0v5l1.5 2h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/></symbol>
      <symbol id="i-undo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></symbol>
      <symbol id="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></symbol>
      <symbol id="i-folder" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3.5 7.5a2 2 0 0 1 2-2h4l2 2.5h7a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/></symbol>
      <symbol id="i-refresh" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 0 0-14.5-4.5L4 8M4 4v4h4M4 13a8 8 0 0 0 14.5 4.5L20 16M20 20v-4h-4"/></symbol>
      <symbol id="i-alert" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5 2.5 20h19z"/><path d="M12 10v4.5M12 17.5h.01"/></symbol>
      <symbol id="i-download" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10.5l5 5 5-5M5 20h14"/></symbol>
      <symbol id="i-upload" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V5M7 9.5l5-5 5 5M5 20h14"/></symbol>
      <symbol id="i-flag" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4.5M5 4.5h11l-2 4 2 4H5"/></symbol>
      <symbol id="i-sparkle" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5c.5 4.5 2.5 6.8 7 7.5-4.5.7-6.5 3-7 7.5-.5-4.5-2.5-6.8-7-7.5 4.5-.7 6.5-3 7-7.5zM19 15c.2 1.8 1 2.8 2.8 3-1.8.2-2.6 1.2-2.8 3-.2-1.8-1-2.8-2.8-3 1.8-.2 2.6-1.2 2.8-3z"/></symbol>
    </defs>
  </svg>

  <div class="app" id="app">
    <aside class="sidebar" id="sidebar" aria-label="Navigation">
      <div class="brand"><img src="icon.png" alt=""><b>Agenda</b></div>
      <nav class="nav" aria-label="Vues">
        <button data-view="agenda"><svg><use href="#i-today"/></svg>Aujourd'hui</button>
        <button data-view="week"><svg><use href="#i-week"/></svg>Semaine</button>
        <button data-view="month"><svg><use href="#i-month"/></svg>Mois</button>
        <button data-view="tasks"><svg><use href="#i-tasks"/></svg>Tâches<span class="count" id="task-count"></span></button>
      </nav>
      <div class="mini" id="mini"></div>
      <div class="side-section">
        <h3>Calendriers</h3>
        <div class="cal-list" id="cal-list"></div>
      </div>
      <div class="side-foot">
        <button class="btn ghost" data-act="settings" title="Réglages"><svg><use href="#i-gear"/></svg>Réglages</button>
        <button class="btn ghost icon" data-act="theme" title="Basculer le thème"><svg><use href="#i-moon"/></svg></button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="btn ghost icon mob-only" data-act="menu" id="menu-btn" aria-label="Menu"><svg><use href="#i-menu"/></svg></button>
        <h1 class="title" id="title">Agenda</h1>
        <div class="nav-arrows desk-only" id="arrows">
          <button class="btn ghost icon" data-act="prev" aria-label="Précédent"><svg><use href="#i-left"/></svg></button>
          <button class="btn ghost icon" data-act="next" aria-label="Suivant"><svg><use href="#i-right"/></svg></button>
        </div>
        <button class="btn" data-act="today" id="today-btn">Aujourd'hui</button>
        <div class="spacer desk-only"></div>
        <div class="segmented desk-only" role="group" aria-label="Vue" id="seg">
          <button data-view="agenda">Jour</button>
          <button data-view="week">Semaine</button>
          <button data-view="month">Mois</button>
          <button data-view="tasks">Tâches</button>
        </div>
        <button class="search-btn" data-act="palette" aria-label="Rechercher ou créer"><svg width="16" height="16"><use href="#i-search"/></svg><span>Rechercher, créer…</span><span class="kbd">Ctrl K</span></button>
        <button class="btn primary desk-only" data-act="new"><svg><use href="#i-plus"/></svg>Nouveau</button>
      </header>
      <div class="banner" id="banner" hidden></div>
      <section class="view" id="view" aria-live="polite"></section>
    </main>

    <nav class="tabbar" id="tabbar" aria-label="Vues">
      <button data-view="agenda"><svg><use href="#i-today"/></svg>Aujourd'hui</button>
      <button data-view="week"><svg><use href="#i-week"/></svg>Semaine</button>
      <button data-view="month"><svg><use href="#i-month"/></svg>Mois</button>
      <button data-view="tasks"><svg><use href="#i-tasks"/></svg>Tâches</button>
    </nav>
    <button class="fab" data-act="new" aria-label="Nouveau"><svg><use href="#i-plus"/></svg></button>
  </div>

  <div id="layer"></div>
  <div class="toasts" id="toasts" role="status"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
